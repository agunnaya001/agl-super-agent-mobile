# Base44 dev environment for the AGL Super Agent web port.
# Frontend (Vite) is the public entry point on port 3000; it proxies /api to the backend.
services:
  backend:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./web/backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - PORT=8000
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./web/frontend:/app
      - web_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://backend:8000
    ports:
      - "3000:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_node_modules:
  web_node_modules:
